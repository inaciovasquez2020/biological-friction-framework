name: melanoma-rank-v5

on:
  push:
    branches:
      - research/melanoma-reo-seven-gene-v3-20261018
    paths:
      - "infra/ci/develop_melanoma_rank_v5.py"
      - "infra/ci/develop_melanoma_reo_v4.py"
      - "infra/ci/preflight_mel_dfci_v2_cohort.py"
      - "tests/test_melanoma_rank_v5.py"
      - ".github/workflows/melanoma-rank-v5.yml"
  pull_request:
    paths:
      - "infra/ci/develop_melanoma_rank_v5.py"
      - "infra/ci/develop_melanoma_reo_v4.py"
      - "infra/ci/preflight_mel_dfci_v2_cohort.py"
      - "tests/test_melanoma_rank_v5.py"
      - ".github/workflows/melanoma-rank-v5.yml"

jobs:
  tests-and-locked-external-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific and test dependencies
        run: python -m pip install numpy scipy scikit-learn pytest
      - name: Test rank representation and model mechanics
        run: pytest -q tests/test_melanoma_rank_v5.py
      - name: Fit fixed rank model on Liu plus Gide and test GSE93157 once
        run: python infra/ci/develop_melanoma_rank_v5.py --output melanoma-rank-v5-receipt.json
      - name: Upload model and external validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: melanoma-rank-v5-receipt
          path: melanoma-rank-v5-receipt.json
          if-no-files-found: error
