name: mel-dfci-v2-cohort-preflight

on:
  push:
    branches:
      - validation/gse91061-frozen-v2-20261018
    paths:
      - "infra/ci/preflight_mel_dfci_v2_cohort.py"
      - ".github/workflows/mel-dfci-v2-cohort-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch source files and run non-scoring cohort preflight
        run: python infra/ci/preflight_mel_dfci_v2_cohort.py
      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-dfci-v2-cohort-preflight
          path: mel_dfci_v2_cohort_preflight.json
          if-no-files-found: warn
