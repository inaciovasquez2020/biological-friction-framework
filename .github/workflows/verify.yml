name: verify
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run certificate check
        run: python3 infra/ci/verify_certificate.py
      - name: Run melanoma interaction graph check
        run: python3 infra/ci/verify_melanoma_interaction_graph.py
      - name: Read GSE299711 file list
        run: |
          set -euo pipefail
          BASE='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl'
          echo 'GSE299711_FILELIST_BEGIN'
          curl --fail --location --retry 3 "$BASE/filelist.txt"
          echo
          echo 'GSE299711_FILELIST_END'
