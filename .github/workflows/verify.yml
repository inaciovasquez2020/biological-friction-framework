name: verify
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run certificate check
        run: python3 infra/ci/verify_certificate.py
      - name: Run melanoma interaction graph check
        run: python3 infra/ci/verify_melanoma_interaction_graph.py
      - name: Probe direct GSE299711 endpoint object
        run: |
          set -euo pipefail
          URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl/GSM9044666_EP_Clonocluster.rds'
          echo 'GSE299711_EP_HEAD_BEGIN'
          curl --head --location --fail --retry 3 "$URL"
          echo 'GSE299711_EP_HEAD_END'
