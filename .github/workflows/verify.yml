name: verify
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run certificate check
        run: python3 infra/ci/verify_certificate.py
      - name: Run melanoma interaction graph check
        run: python3 infra/ci/verify_melanoma_interaction_graph.py
      - name: Install minimal R analysis surface
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-matrix r-cran-seuratobject
          Rscript -e 'cat("R=", R.version.string, "\n", sep=""); cat("Matrix=", requireNamespace("Matrix", quietly=TRUE), "\n", sep=""); cat("SeuratObject=", requireNamespace("SeuratObject", quietly=TRUE), "\n", sep="")'
      - name: Range-download GSE299711 endpoint object
        run: |
          set -euo pipefail
          URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl/GSE299711_RAW.tar'
          START=1896609280
          END=2585827887
          EXPECTED=689218608
          curl --fail --location --retry 3 --range "${START}-${END}" "$URL" --output /tmp/GSM9044666_EP_Clonocluster.rds
          ACTUAL=$(stat -c%s /tmp/GSM9044666_EP_Clonocluster.rds)
          echo "RDS_SIZE=${ACTUAL}"
          test "$ACTUAL" -eq "$EXPECTED"
      - name: Diagnose endpoint RNA feature identifiers
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          suppressPackageStartupMessages(library(SeuratObject))
          suppressPackageStartupMessages(library(Matrix))

          path <- '/tmp/GSM9044666_EP_Clonocluster.rds'
          obj <- readRDS(path)
          cat('CSE_FEATURE_DIAGNOSTIC_BEGIN\n')
          cat('object_class=', paste(class(obj), collapse=','), '\n', sep='')
          stopifnot(isS4(obj))
          stopifnot('meta.data' %in% slotNames(obj))
          meta <- obj@meta.data
          stopifnot('bc_group' %in% colnames(meta))
          stopifnot('assays' %in% slotNames(obj))
          stopifnot('RNA' %in% names(obj@assays))
          rna <- obj@assays[['RNA']]
          cat('rna_class=', paste(class(rna), collapse=','), '\n', sep='')
          cat('rna_slots=', paste(slotNames(rna), collapse='|'), '\n', sep='')

          if ('data' %in% slotNames(rna)) {
            mat <- rna@data
            layer_source <- 'RNA@data'
          } else if ('layers' %in% slotNames(rna) && 'data' %in% names(rna@layers)) {
            mat <- rna@layers[['data']]
            layer_source <- 'RNA@layers$data'
          } else {
            stop('normalized RNA data layer not found')
          }

          features <- rownames(mat)
          stopifnot(!is.null(features))
          cat('layer_source=', layer_source, '\n', sep='')
          cat('feature_count=', length(features), '\n', sep='')
          cat('first_features=', paste(head(features, 10), collapse='|'), '\n', sep='')
          cth_like <- grep('CTH', features, ignore.case=TRUE, value=TRUE)
          cat('rownames_cth_like=', if (length(cth_like)) paste(cth_like, collapse='|') else '<none>', '\n', sep='')

          if ('meta.features' %in% slotNames(rna)) {
            mf <- rna@meta.features
            cat('meta_features_columns=', paste(colnames(mf), collapse='|'), '\n', sep='')
            cat('meta_features_rows=', nrow(mf), '\n', sep='')
            hits <- integer(0)
            if (nrow(mf) > 0 && ncol(mf) > 0) {
              for (j in seq_len(ncol(mf))) {
                vals <- as.character(mf[[j]])
                hits <- union(hits, which(grepl('CTH', vals, ignore.case=TRUE)))
              }
            }
            if (length(hits)) {
              hits <- head(hits, 20)
              for (i in hits) {
                cat('META_CTH_HIT row=', i,
                    ' feature=', rownames(mf)[i],
                    ' values=', paste(as.character(mf[i, , drop=TRUE]), collapse='|'),
                    '\n', sep='')
              }
            } else {
              cat('meta_features_cth_like=<none>\n')
            }
          } else {
            cat('meta_features_slot=<absent>\n')
          }
          cat('CSE_FEATURE_DIAGNOSTIC_END\n')
          RS
