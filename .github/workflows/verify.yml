name: verify
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run certificate check
        run: python3 infra/ci/verify_certificate.py
      - name: Run melanoma interaction graph check
        run: python3 infra/ci/verify_melanoma_interaction_graph.py
      - name: Probe R surface for endpoint-object analysis
        run: |
          set -euo pipefail
          echo 'R_SURFACE_BEGIN'
          if command -v Rscript >/dev/null 2>&1; then
            Rscript --version
            Rscript -e 'cat("Matrix=", requireNamespace("Matrix", quietly=TRUE), "\n", sep=""); cat("SeuratObject=", requireNamespace("SeuratObject", quietly=TRUE), "\n", sep="")'
          else
            echo 'Rscript=missing'
          fi
          echo 'R_SURFACE_END'
