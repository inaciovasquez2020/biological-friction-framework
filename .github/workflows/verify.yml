name: verify
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run certificate check
        run: python3 infra/ci/verify_certificate.py
      - name: Run melanoma interaction graph check
        run: python3 infra/ci/verify_melanoma_interaction_graph.py
      - name: Install minimal R analysis surface
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-matrix r-cran-seuratobject
          Rscript -e 'cat("R=", R.version.string, "\n", sep=""); cat("Matrix=", requireNamespace("Matrix", quietly=TRUE), "\n", sep=""); cat("SeuratObject=", requireNamespace("SeuratObject", quietly=TRUE), "\n", sep="")'
      - name: Range-download GSE299711 endpoint object
        run: |
          set -euo pipefail
          URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl/GSE299711_RAW.tar'
          START=1896609280
          END=2585827887
          EXPECTED=689218608
          curl --fail --location --retry 3 --range "${START}-${END}" "$URL" --output /tmp/GSM9044666_EP_Clonocluster.rds
          ACTUAL=$(stat -c%s /tmp/GSM9044666_EP_Clonocluster.rds)
          echo "RDS_SIZE=${ACTUAL}"
          test "$ACTUAL" -eq "$EXPECTED"
      - name: Diagnose Assay5 feature map
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          suppressPackageStartupMessages(library(SeuratObject))
          suppressPackageStartupMessages(library(Matrix))

          obj <- readRDS('/tmp/GSM9044666_EP_Clonocluster.rds')
          rna <- obj@assays[['RNA']]
          stopifnot(inherits(rna, 'Assay5'))
          cat('CSE_ASSAY5_DIAGNOSTIC_BEGIN\n')
          cat('layer_names=', paste(names(rna@layers), collapse='|'), '\n', sep='')
          for (nm in names(rna@layers)) {
            x <- rna@layers[[nm]]
            cat('LAYER name=', nm,
                ' nrow=', nrow(x),
                ' ncol=', ncol(x),
                ' rownames_null=', is.null(rownames(x)),
                ' colnames_null=', is.null(colnames(x)),
                '\n', sep='')
          }

          fmap <- rna@features
          cat('feature_map_class=', paste(class(fmap), collapse=','), '\n', sep='')
          cat('feature_map_dim=', paste(dim(fmap), collapse='x'), '\n', sep='')
          fmap_names <- rownames(fmap)
          cat('feature_map_rownames_null=', is.null(fmap_names), '\n', sep='')
          if (!is.null(fmap_names)) {
            cat('feature_map_first=', paste(head(fmap_names, 10), collapse='|'), '\n', sep='')
            hits <- grep('CTH', fmap_names, ignore.case=TRUE, value=TRUE)
            cat('feature_map_cth_like=', if (length(hits)) paste(hits, collapse='|') else '<none>', '\n', sep='')
          }

          assay_names <- tryCatch(rownames(rna), error=function(e) NULL)
          cat('assay_rownames_null=', is.null(assay_names), '\n', sep='')
          if (!is.null(assay_names)) {
            cat('assay_feature_count=', length(assay_names), '\n', sep='')
            cat('assay_first=', paste(head(assay_names, 10), collapse='|'), '\n', sep='')
            hits <- grep('CTH', assay_names, ignore.case=TRUE, value=TRUE)
            cat('assay_cth_like=', if (length(hits)) paste(hits, collapse='|') else '<none>', '\n', sep='')
          }

          layer_features <- tryCatch(Features(rna, layer='data'), error=function(e) NULL)
          cat('Features_data_null=', is.null(layer_features), '\n', sep='')
          if (!is.null(layer_features)) {
            cat('Features_data_count=', length(layer_features), '\n', sep='')
            cat('Features_data_first=', paste(head(layer_features, 10), collapse='|'), '\n', sep='')
            hits <- grep('CTH', layer_features, ignore.case=TRUE, value=TRUE)
            cat('Features_data_cth_like=', if (length(hits)) paste(hits, collapse='|') else '<none>', '\n', sep='')
          }
          cat('CSE_ASSAY5_DIAGNOSTIC_END\n')
          RS
