name: melanoma-gse78220-v2-development-audit

on:
  push:
    paths:
      - "infra/ci/audit_gse78220_v2_development.py"
      - "infra/ci/score_melanoma_route_burden_v2.py"
      - "tests/test_gse78220_v2_development_audit.py"
      - ".github/workflows/melanoma-v2-development-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openpyxl

      - name: Run v2 development-audit unit tests
        run: |
          pytest -q tests/test_gse78220_v2_development_audit.py tests/test_melanoma_route_burden_v2.py

      - name: Run checksum-locked GSE78220 v2 development screen
        run: |
          python infra/ci/audit_gse78220_v2_development.py --output gse78220-v2-development-audit.json

      - name: Upload v2 development audit
        uses: actions/upload-artifact@v4
        with:
          name: gse78220-v2-development-audit
          path: gse78220-v2-development-audit.json
          if-no-files-found: error
