name: cse-gse299711-data-probe-temp

on:
  push:
    branches:
      - research/melanoma-cse-gse299711-data-probe-20260831

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List GSE299711 supplementary files
        run: |
          set -euo pipefail
          URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl/'
          echo 'GSE299711_SUPPL_BEGIN'
          curl --fail --location --retry 3 "$URL" --output /tmp/gse299711_index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.links.append(href)

          parser = Links()
          parser.feed(Path('/tmp/gse299711_index.html').read_text(encoding='utf-8', errors='replace'))
          for href in parser.links:
              if href not in {'../', '/'}:
                  print(href)
          PY
          echo 'GSE299711_SUPPL_END'

      - name: Probe expected endpoint-object names
        run: |
          set -euo pipefail
          BASE='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE299nnn/GSE299711/suppl'
          for NAME in \
            'EP_Clonocluster.rds' \
            'EP_Clonocluster.rds.gz' \
            'GSE299711_EP_Clonocluster.rds' \
            'GSE299711_EP_Clonocluster.rds.gz'; do
            CODE=$(curl --location --silent --output /dev/null --write-out '%{http_code}' "$BASE/$NAME")
            echo "$CODE $NAME"
          done
