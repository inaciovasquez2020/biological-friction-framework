name: ferroptosis-source-data-temp

on:
  push:
    branches:
      - research/melanoma-ferroptosis-source-data-probe-20260831

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Download Nature Fig 3 source data
        run: |
          curl --fail --location --retry 3 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41586-025-09709-1/MediaObjects/41586_2025_9709_MOESM7_ESM.xlsx' \
            --output /tmp/fig3.xlsx
      - name: Inspect reoxygenation workbook labels
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          p='/tmp/fig3.xlsx'
          wb=load_workbook(p, data_only=True, read_only=True)
          print('SHEETS', wb.sheetnames)
          terms=('FSP1','GPX4','reoxygen','oxygen','2 h','4 h','8 h','2h','4h','8h','1%','21%')
          for ws in wb.worksheets:
              hits=[]
              for row in ws.iter_rows():
                  for cell in row:
                      v=cell.value
                      if isinstance(v,str) and any(t.lower() in v.lower() for t in terms):
                          hits.append((cell.coordinate,v))
              if hits:
                  print('SHEET',ws.title)
                  for hit in hits[:200]:
                      print(hit)
          print('DONE')
          PY
