name: melanoma-cth-pmc-probe

on:
  push:
    branches:
      - research/melanoma-cth-pmc-fetch-20260831

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download official PMC preprint supplement and inspect CTH
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET

          url = "https://pmc.ncbi.nlm.nih.gov/articles/instance/12458950/bin/media-2.xlsx"
          out = "/tmp/media-2.xlsx"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 MeRLin-CTH-audit/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r, open(out, "wb") as f:
              f.write(r.read())
          print(f"PMC_SUPPLEMENT_BYTES={os.path.getsize(out)}")

          ns = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main",
                "r": "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
                "pr": "http://schemas.openxmlformats.org/package/2006/relationships"}

          with zipfile.ZipFile(out) as z:
              shared = []
              if "xl/sharedStrings.xml" in z.namelist():
                  root = ET.fromstring(z.read("xl/sharedStrings.xml"))
                  for si in root.findall("m:si", ns):
                      shared.append("".join(t.text or "" for t in si.iter("{http://schemas.openxmlformats.org/spreadsheetml/2006/main}t")))

              wb = ET.fromstring(z.read("xl/workbook.xml"))
              rels = ET.fromstring(z.read("xl/_rels/workbook.xml.rels"))
              targets = {rel.attrib["Id"]: rel.attrib["Target"] for rel in rels}
              sheets = []
              for s in wb.find("m:sheets", ns):
                  name = s.attrib["name"]
                  rid = s.attrib["{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id"]
                  target = targets[rid]
                  if target.startswith("/"):
                      path = target.lstrip("/")
                  elif target.startswith("xl/"):
                      path = target
                  else:
                      path = "xl/" + target
                  sheets.append((name, path))

              print("WORKBOOK_SHEETS=" + " | ".join(name for name, _ in sheets))
              exact_matches = 0
              token_matches = 0
              for sheet_name, path in sheets:
                  root = ET.fromstring(z.read(path))
                  for row in root.findall(".//m:row", ns):
                      vals = []
                      for c in row.findall("m:c", ns):
                          typ = c.attrib.get("t")
                          v = c.find("m:v", ns)
                          if typ == "inlineStr":
                              isel = c.find("m:is", ns)
                              val = "" if isel is None else "".join(t.text or "" for t in isel.iter("{http://schemas.openxmlformats.org/spreadsheetml/2006/main}t"))
                          elif v is None:
                              val = ""
                          elif typ == "s":
                              try:
                                  val = shared[int(v.text)]
                              except Exception:
                                  val = v.text or ""
                          else:
                              val = v.text or ""
                          vals.append(val)
                      exact = any(v.strip().upper() == "CTH" for v in vals)
                      token = any(re.search(r"(^|[^A-Za-z0-9])CTH([^A-Za-z0-9]|$)", v, flags=re.I) for v in vals)
                      if exact or token:
                          if exact:
                              exact_matches += 1
                          if token:
                              token_matches += 1
                          compact = " | ".join(v.replace("\n", " ")[:300] for v in vals)
                          print(f"CTH_ROW sheet={sheet_name!r} row={row.attrib.get('r')} exact={exact} :: {compact}")
              print(f"CTH_EXACT_ROWS={exact_matches}")
              print(f"CTH_TOKEN_ROWS={token_matches}")
          PY

          cp /tmp/media-2.xlsx ./media-2.xlsx

      - name: Upload supplement for verifier inspection
        uses: actions/upload-artifact@v4
        with:
          name: merlin-preprint-media-2
          path: media-2.xlsx
          retention-days: 1
